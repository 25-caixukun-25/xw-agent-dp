server:
  port: 8081

spring:
  application:
    name: zhimi-life
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zhimi_life?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 1
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s
  ai:
    retry:
      max-attempts: 1
    model:
      chat: openai
      embedding: none
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
          max-tokens: 800
          stream-usage: true

mybatis-plus:
  type-aliases-package: com.hmdp.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

hmdp:
  agent:
    memory-ttl-minutes: 120
    max-history-messages: 20
    max-tool-rounds: 4
    enabled: true
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: text-embedding-v4
    dimensions: 1024
    batch-size: 10

logging:
  level:
    com.hmdp: debug
    org.springframework.ai: info
